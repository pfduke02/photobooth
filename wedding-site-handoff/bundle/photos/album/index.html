<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The album — Lisa &amp; Pete</title>
<meta name="description" content="Photos and videos from Lisa &amp; Pete's wedding, shared by their guests.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f3ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://hseupjbneifqxaykxltt.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Archivo:wght@400;500;600&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f6f3ea; --paper: #fbf9f3; --ink: #1d2433; --muted: rgba(29,36,51,0.72);
    --terracotta: #b05f36; --forest: #26493a; --forest-dark: #1c372b; --line: rgba(29,36,51,0.14);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); font-family: 'Archivo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--forest); }
  a:hover { color: var(--terracotta); }

  header { border-bottom: 1px solid var(--line); }
  .bar { max-width: 1160px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); text-decoration: none; }
  .logo span { color: var(--terracotta); font-style: italic; }
  .bar a.add { font-size: 14px; font-weight: 500; }

  main { max-width: 1160px; margin: 0 auto; padding: 44px 16px 80px; padding-bottom: max(80px, env(safe-area-inset-bottom)); }
  .hero { text-align: center; margin-bottom: 32px; }
  .eyebrow { font-family: 'Cormorant Garamond', serif; font-size: 13px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--terracotta); }
  .names { margin: 10px 0 6px; font-family: 'Pinyon Script', 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(48px, 12vw, 72px); line-height: 1.1; }
  .rule { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 2px 0 12px; }
  .rule span { width: 56px; height: 1px; background: rgba(29,36,51,0.35); }
  .rule i { width: 4px; height: 4px; border-radius: 50%; background: rgba(29,36,51,0.55); }
  .date { margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 14px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .lead { margin: 20px auto 4px; max-width: 520px; font-family: 'Cormorant Garamond', serif; font-size: 24px; line-height: 1.3; font-weight: 500; text-wrap: balance; }
  .count { margin: 0; font-size: 14px; color: var(--muted); min-height: 20px; }

  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .tile { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 4px; overflow: hidden; background: #e9e3d3; cursor: zoom-in; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s ease; }
  .tile:hover img { transform: scale(1.03); }
  .tile:focus-visible { outline: 3px solid rgba(176,95,54,0.55); outline-offset: 2px; }
  .tile .vph { position: absolute; inset: 0; background: linear-gradient(135deg, #2b2f3a, #11141c); }
  .tile .play { position: absolute; left: 6px; bottom: 6px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(13,15,20,0.72); color: #fff; pointer-events: none; }
  .more { display: flex; justify-content: center; margin-top: 24px; }
  .tbtn { min-height: 44px; padding: 0 22px; border: 1px solid var(--forest); border-radius: 6px; background: transparent; color: var(--forest); font: 600 15px 'Archivo', system-ui, sans-serif; cursor: pointer; }
  .tbtn:hover { background: rgba(38,73,58,0.06); }

  .msg { max-width: 520px; margin: 8px auto 0; padding: 24px; text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; font-family: 'Cormorant Garamond', serif; font-size: 22px; line-height: 1.35; }
  .msg a { display: inline-block; margin-top: 14px; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; font-weight: 600; }

  dialog { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; margin: 0; padding: 0; border: 0; background: #0d0f14; color: #f6f3ea; }
  dialog::backdrop { background: #0d0f14; }
  .lb { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
  .lb-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .lb-stage video { max-width: 100%; max-height: 100%; display: block; background: #000; outline: none; }
  .lb-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); font-size: 14px; color: rgba(246,243,234,0.8); }
  .lb-bar a { color: #f6f3ea; font-weight: 600; text-decoration: none; border: 1px solid rgba(246,243,234,0.45); border-radius: 6px; padding: 9px 14px; white-space: nowrap; }
  .lb-bar a:hover { background: rgba(246,243,234,0.1); }
  .nav, .close { position: absolute; border: 0; border-radius: 50%; background: rgba(246,243,234,0.14); color: #f6f3ea; cursor: pointer; }
  .nav { top: 50%; transform: translateY(-50%); width: 46px; height: 46px; font-size: 24px; }
  .nav.prev { left: 10px; } .nav.next { right: 10px; }
  .close { top: max(10px, env(safe-area-inset-top)); right: 10px; width: 42px; height: 42px; font-size: 22px; z-index: 2; }
  .nav:hover, .close:hover { background: rgba(246,243,234,0.26); }
  @media (hover: none) { .nav { display: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="/" aria-label="Lisa &amp; Pete — wedding home">L <span>&amp;</span> P</a>
    <a class="add" id="addTop" href="/photos/">Add photos &amp; videos</a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">The album</div>
    <h1 class="names">Lisa &amp; Pete</h1>
    <div class="rule" aria-hidden="true"><span></span><i></i><span></span></div>
    <p class="date">November 7, 2026 · Il Bacco</p>
    <p class="lead">Our wedding, through your eyes.</p>
    <p class="count" id="count" aria-live="polite"></p>
  </section>

  <div id="msg" class="msg" hidden></div>
  <div id="grid" class="grid"></div>
  <div class="more"><button id="more" class="tbtn" type="button" hidden>Show more</button></div>
</main>

<dialog id="lb" aria-label="Photo">
  <div class="lb">
    <div class="lb-stage" id="stage">
      <img id="lbImg" alt="">
      <video id="lbVid" controls playsinline preload="metadata" hidden></video>
      <button class="nav prev" id="prev" type="button" aria-label="Previous photo">‹</button>
      <button class="nav next" id="next" type="button" aria-label="Next photo">›</button>
    </div>
    <button class="close" id="close" type="button" aria-label="Close" autofocus>×</button>
    <div class="lb-bar">
      <span id="lbCaption"></span>
      <a id="lbDownload" href="#" download>Download</a>
    </div>
  </div>
</dialog>

<script>
(() => {
  'use strict';
  const API = 'https://hseupjbneifqxaykxltt.supabase.co/functions/v1/api';
  const DEFAULT_EVENT = 'bf4d479a7b1c16d5b088ede0';
  const PAGE = 60;
  const $ = (id) => document.getElementById(id);
  const hex = (v) => ((v || '').match(/[a-f0-9]{16,64}/i) || [''])[0].toLowerCase();
  const EVENT = hex(new URLSearchParams(location.search).get('e')) || DEFAULT_EVENT;
  if (EVENT !== DEFAULT_EVENT) $('addTop').href = '/photos/?e=' + EVENT;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function api(action, extra) {
    let last = null;
    for (let a = 0; a < 4; a++) {
      if (a) await sleep(600 * Math.pow(2, a - 1) + Math.random() * 300);
      let res;
      try {
        res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ e: EVENT, action }, extra || {})) });
      } catch (e) { last = new Error('network'); continue; }
      let d = null; try { d = await res.json(); } catch (e) { /* not json */ }
      if (res.ok && d && d.ok) return d;
      const err = new Error((d && d.error) || ('HTTP ' + res.status));
      err.status = res.status;
      if (res.status >= 500 || res.status === 429) { last = err; continue; }
      throw err;
    }
    throw last || new Error('network');
  }

  const when = (iso) => { try { return new Date(iso).toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } };
  const credit = (c) => c ? 'Shared by ' + c : 'Shared by a guest';
  const fmtDur = (s) => { s = Math.round(Number(s) || 0); if (!s) return ''; return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  let items = [], total = 0, videos = 0, people = 0, offset = 0, truncated = false, loading = false, loadedAt = 0, current = -1;

  function message(html) {
    const m = $('msg');
    m.textContent = '';
    for (const part of html) m.append(part);
    m.hidden = false;
  }
  function addLink(text) {
    const a = document.createElement('a');
    a.href = $('addTop').href; a.textContent = text;
    return a;
  }

  function showCount() {
    if (!total) { $('count').textContent = ''; return; }
    const photos = Math.max(0, total - videos);
    const what = [photos ? photos + (photos === 1 ? ' photo' : ' photos') : '', videos ? videos + (videos === 1 ? ' video' : ' videos') : ''].filter(Boolean).join(' and ');
    $('count').textContent = what + (people ? ' from ' + people + (people === 1 ? ' guest' : ' guests') : '');
  }

  function appendTiles(list, startIndex) {
    const grid = $('grid');
    list.forEach((it, k) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tile';
      const isVid = it.kind === 'video';
      b.setAttribute('aria-label', 'Open ' + (isVid ? 'video' : 'photo') + '. ' + credit(it.contributor));
      if (isVid && !it.thumbUrl) { const ph = document.createElement('div'); ph.className = 'vph'; b.appendChild(ph); }
      else {
        const img = document.createElement('img');
        img.src = it.thumbUrl || it.url; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
        img.addEventListener('error', () => { if (!isVid && it.url && img.src !== it.url) img.src = it.url; }, { once: true });
        b.appendChild(img);
      }
      if (isVid) { const p = document.createElement('span'); p.className = 'play'; p.textContent = '▶ ' + (fmtDur(it.duration) || 'video'); b.appendChild(p); }
      b.addEventListener('click', () => open(startIndex + k));
      grid.appendChild(b);
    });
  }

  async function load(reset) {
    if (loading) return;
    loading = true;
    if (reset) { items = []; offset = 0; $('grid').textContent = ''; }
    try {
      const d = await api('album', { offset, limit: PAGE });
      const list = d.items || [];
      const start = items.length;
      items = items.concat(list);
      offset += Number(d.limit) || PAGE;
      total = Number(d.total) || items.length;
      people = Number(d.contributors) || 0;
      videos = Number(d.videos) || 0;
      truncated = !!d.truncated;
      loadedAt = Date.now();
      $('msg').hidden = true;
      appendTiles(list, start);
      showCount();
      $('more').hidden = !truncated;
      if (!items.length) message(['Nothing in the album yet.', document.createElement('br'), addLink('Add your photos & videos')]);
    } catch (e) {
      $('more').hidden = true;
      if (e.status === 403) message(["The album isn't ready yet. Lisa & Pete are still choosing photos, so check back soon.", document.createElement('br'), addLink('Add your photos & videos')]);
      else if (e.status === 401) message(['This album link is not valid.']);
      else message(['Could not load the album. Check your connection and refresh.']);
    } finally { loading = false; }
  }

  // keep loading as the reader scrolls
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      if (entries.some((x) => x.isIntersecting) && truncated && !loading) load(false);
    }, { rootMargin: '600px' }).observe($('more'));
  }
  $('more').addEventListener('click', () => load(false));

  // ---------- viewer ----------
  function open(i) {
    const it = items[i]; if (!it) return;
    current = i;
    const img = $('lbImg'), vid = $('lbVid');
    if (it.kind === 'video') {
      img.hidden = true; img.removeAttribute('src');
      vid.hidden = false;
      if (vid.dataset.id !== it.id) { vid.pause(); vid.poster = it.thumbUrl || ''; vid.src = it.url; vid.dataset.id = it.id; vid.load(); }
      vid.setAttribute('aria-label', 'Video. ' + credit(it.contributor));
      vid.play().catch(() => { /* the guest taps play */ });
    } else {
      vid.pause(); vid.hidden = true;
      img.hidden = false;
      // Show the small copy at once (it's already loaded in the grid), then swap in the full-size
      // photo when it arrives. iPhone HEIC originals don't display outside Safari: keep the small copy.
      const full = it.url || it.thumbUrl;
      img.onerror = () => { if (it.thumbUrl && img.src !== it.thumbUrl) img.src = it.thumbUrl; };
      img.src = it.thumbUrl || full;
      if (full && full !== img.src) {
        const pre = new Image();
        pre.onload = () => { if (current === i) img.src = full; };
        pre.src = full;
      }
      img.alt = 'Photo. ' + credit(it.contributor);
    }
    $('lbCaption').textContent = credit(it.contributor) + (it.at ? ' · ' + when(it.at) : '') + (it.kind === 'video' && it.duration ? ' · ' + fmtDur(it.duration) : '');
    $('lbDownload').href = it.downloadUrl || it.url;
    if (!$('lb').open) $('lb').showModal();
    if (i >= items.length - 3 && truncated && !loading) load(false);
  }
  function step(d) { if (items.length) open((current + d + items.length) % items.length); }
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  $('close').addEventListener('click', () => $('lb').close());
  $('lb').addEventListener('close', () => { $('lbVid').pause(); });
  document.addEventListener('keydown', (e) => {
    if (!$('lb').open || e.target === $('lbVid')) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  let x0 = null;
  $('stage').addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  });
  $('stage').addEventListener('click', (e) => { if (e.target === $('stage')) $('lb').close(); });

  // photo links last an hour; refresh them when the reader comes back later
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && loadedAt && Date.now() - loadedAt > 50 * 60 * 1000) load(true);
  });

  load(true);
})();
</script>
</body>
</html>
